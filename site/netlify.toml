[build]
  publish = "."
  functions = "../netlify/functions"

# URLs antigos do WordPress → páginas novas (mantém o valor do Google)
[[redirects]]
  from = "/2026/03/13/taniasilveira-pt/"
  to = "/"
  status = 301
[[redirects]]
  from = "/author/*"
  to = "/sobre/"
  status = 301
[[redirects]]
  from = "/category/*"
  to = "/guias/"
  status = 301
[[redirects]]
  from = "/wp-sitemap.xml"
  to = "/sitemap.xml"
  status = 301
[[redirects]]
  from = "/feed/*"
  to = "/guias/"
  status = 301
[[redirects]]
  from = "/diagnostico/"
  to = "/diagnostico-alinhavar/"
  status = 301
[[redirects]]
  from = "/fibra/"
  to = "/metodo-fibra/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
