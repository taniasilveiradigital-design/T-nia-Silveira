<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
const P = new URLSearchParams(location.search);
const W = +P.get('w') || 1920, H = +P.get('h') || 1080;
const c = document.getElementById('c'); c.width = W; c.height = H;
const ctx = c.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const b = buf.getContext('2d');
const U = Math.min(W, H) / 1080;          // base unit
const PORTRAIT = H > W;
const RED = '#d62027', DEEP = '#7a0a10', CREAM = '#fff4ea';
const FONT = '"Inter Display", Inter, sans-serif';
const DUR = 15;

const img = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s; });
let LOGO, LOGOW, BAND, GRAIN = [];

// helpers
const clamp = (v, a = 0, z = 1) => Math.max(a, Math.min(z, v));
const prog = (t, a, z) => clamp((t - a) / (z - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const rnd = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

function fit(text, weight, size, maxW, ls = 0) {
  b.font = `${weight} ${size}px ${FONT}`;
  const w = b.measureText(text).width + ls * (text.length - 1);
  return w > maxW ? size * maxW / w : size;
}
function txt(text, x, y, { size = 80, weight = 900, color = '#fff', alpha = 1, ls = 0, align = 'center', maxW = W * .86, glow = 0, scale = 1 } = {}) {
  const s = fit(text, weight, size, maxW, ls * size) ;
  b.save(); b.globalAlpha = clamp(alpha);
  b.translate(x, y); b.scale(scale, scale);
  b.font = `${weight} ${s}px ${FONT}`; b.fillStyle = color; b.textBaseline = 'middle';
  if (glow) { b.shadowColor = RED; b.shadowBlur = glow * U; }
  if ('letterSpacing' in b) { b.letterSpacing = (ls * s) + 'px'; }
  b.textAlign = align;
  b.fillText(text, 0, 0);
  b.restore();
  return s;
}
function boxTxt(text, x, y, { size = 100, alpha = 1, scale = 1, padX = .45, padY = .32, color = '#fff', fill = RED, weight = 900 } = {}) {
  const fs = fit(text, weight, size, W * .8);
  b.font = `${weight} ${fs}px ${FONT}`; const w = b.measureText(text).width;
  b.save(); b.globalAlpha = clamp(alpha); b.translate(x, y); b.scale(scale, scale);
  b.fillStyle = fill; b.fillRect(-w / 2 - fs * padX, -fs * (.5 + padY), w + fs * padX * 2, fs * (1 + padY * 2));
  b.fillStyle = color; b.textAlign = 'center'; b.textBaseline = 'middle'; b.fillText(text, 0, fs * .04);
  b.restore();
}
function bg(color = '#000') { b.fillStyle = color; b.fillRect(0, 0, W, H); }
function radial(x, y, r, col, a) {
  const g = b.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  b.save(); b.globalAlpha = a; b.fillStyle = g; b.fillRect(0, 0, W, H); b.restore();
}
function beams(t, a) { // stage light beams from top
  b.save(); b.globalCompositeOperation = 'lighter'; b.globalAlpha = a;
  for (let i = 0; i < 5; i++) {
    const ox = W * (0.1 + i * 0.2), ang = Math.sin(t * 1.3 + i * 1.7) * 0.45;
    const len = H * 1.4, wd = 160 * U;
    b.save(); b.translate(ox, -40 * U); b.rotate(ang);
    const g = b.createLinearGradient(0, 0, 0, len);
    g.addColorStop(0, 'rgba(214,32,39,0.55)'); g.addColorStop(1, 'rgba(214,32,39,0)');
    b.fillStyle = g; b.beginPath(); b.moveTo(-8 * U, 0); b.lineTo(8 * U, 0); b.lineTo(wd, len); b.lineTo(-wd, len); b.closePath(); b.fill();
    b.restore();
  }
  b.restore();
}
function logo(x, y, h, { alpha = 1, white = false, rot = 0 } = {}) {
  const im = white ? LOGOW : LOGO; const w = h * im.width / im.height;
  b.save(); b.globalAlpha = clamp(alpha); b.translate(x, y); b.rotate(rot);
  b.drawImage(im, -w / 2, -h / 2, w, h); b.restore();
}
function shake(t, amt) { return [(rnd(Math.floor(t * 60)) - .5) * amt * U, (rnd(Math.floor(t * 60) + 9) - .5) * amt * U]; }

// SCENES ----------------------------------------------------------
function s1(t) { // 0 - 2.6  "aviso" 18+
  bg('#000');
  const fl = t < .5 ? (rnd(Math.floor(t * 30)) > .45 ? 1 : .15) : 1;
  const a = prog(t, 0, .35) * fl * (1 - prog(t, 2.35, 2.6));
  const cy = H * (PORTRAIT ? .42 : .40);
  const R = 150 * U * (1 + .03 * Math.sin(t * 8));
  b.save(); b.globalAlpha = a; b.strokeStyle = RED; b.lineWidth = 16 * U;
  b.beginPath(); b.arc(W / 2, cy, R, 0, Math.PI * 2); b.stroke(); b.restore();
  txt('18+', W / 2, cy + 6 * U, { size: 150 * U, color: '#fff', alpha: a });
  txt('AVISO', W / 2, cy + R + 95 * U, { size: 34 * U, weight: 700, color: RED, alpha: a * prog(t, .5, .8), ls: .45 });
  txt('O que vem a seguir é para maiores de 18.', W / 2, cy + R + 160 * U, { size: 46 * U, weight: 500, color: CREAM, alpha: a * prog(t, .8, 1.2), maxW: W * .84 });
}
function s2(t) { // 2.6 - 5.2  2009 -> 2027
  bg('#000');
  const lt = t - 2.6;
  const p = eInOut(prog(lt, .15, 1.9));
  const year = Math.round(2009 + p * 18);
  const done = lt > 1.9;
  const pulse = done ? Math.max(0, 1 - (lt - 1.9) * 2.5) : 0;
  radial(W / 2, H / 2, Math.max(W, H) * .6, RED, .25 + pulse * .6);
  const [sx, sy] = done ? shake(lt, 26 * pulse) : [0, 0];
  const a = prog(lt, 0, .2) * (1 - prog(lt, 2.4, 2.6));
  txt('DESDE 2009', W / 2 + sx, H / 2 - 210 * U + sy, { size: 38 * U, weight: 700, color: RED, ls: .4, alpha: a });
  txt(String(year), W / 2 + sx, H / 2 + 10 * U + sy, { size: 330 * U, color: done ? '#fff' : CREAM, alpha: a, glow: done ? 60 : 0, scale: 1 + pulse * .08 });
  txt(done ? '18 anos de marotice.' : ' ', W / 2 + sx, H / 2 + 230 * U + sy, { size: 50 * U, weight: 600, color: CREAM, alpha: a * prog(lt, 1.95, 2.2) });
}
function s3(t) { // 5.2 - 8.0 band photo
  const lt = t - 5.2;
  bg('#000');
  // cover image with slow zoom
  const z = 1.06 + lt * .03;
  const sc = Math.max(W / BAND.width, H / BAND.height) * z;
  const iw = BAND.width * sc, ih = BAND.height * sc;
  b.save(); b.globalAlpha = prog(lt, 0, .25) * (1 - prog(lt, 2.55, 2.8));
  b.filter = 'grayscale(1) contrast(1.25) brightness(.85)';
  b.drawImage(BAND, (W - iw) / 2 + (PORTRAIT ? 0 : -lt * 18 * U), (H - ih) / 2, iw, ih);
  b.filter = 'none';
  b.globalCompositeOperation = 'multiply'; b.fillStyle = RED; b.fillRect(0, 0, W, H);
  b.globalCompositeOperation = 'source-over';
  const g = b.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(0,0,0,.35)'); g.addColorStop(.55, 'rgba(0,0,0,.25)'); g.addColorStop(1, 'rgba(0,0,0,.85)');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  b.restore();
  const out = 1 - prog(lt, 2.55, 2.8);
  const p1 = eBack(prog(lt, .2, .55)), p2 = eBack(prog(lt, 1.0, 1.35));
  const [sx, sy] = lt > .2 && lt < .4 ? shake(lt, 22) : (lt > 1.0 && lt < 1.2 ? shake(lt, 22) : [0, 0]);
  const y0 = PORTRAIT ? H * .62 : H * .6;
  txt('18 anos.', W / 2 + sx, y0 - 80 * U + sy, { size: 200 * U, color: '#fff', alpha: prog(lt, .2, .3) * out, scale: 1.4 - .4 * p1 });
  boxTxt('Ainda mais marotos.', W / 2 + sx, y0 + 110 * U + sy, { size: 110 * U, alpha: prog(lt, 1.0, 1.1) * out, scale: 1.4 - .4 * p2 });
}
function s4(t) { // 8.0 - 10.0 logo drop
  const lt = t - 8.0;
  bg('#000');
  beams(t, .55 * prog(lt, .3, .8));
  const land = .55;
  const p = eBack(prog(lt, 0, land));
  const impact = lt > land ? Math.max(0, 1 - (lt - land) * 2.2) : 0;
  radial(W / 2, H / 2, Math.max(W, H) * .55, RED, .2 + impact * .7);
  const [sx, sy] = shake(lt, 34 * impact);
  const h = (PORTRAIT ? 560 : 520) * U * (1 + impact * .06);
  const y = -H * .5 + (H / 2 + H * .5) * p;
  logo(W / 2 + sx, y + sy, h, { rot: (1 - p) * -.25 + Math.sin(lt * 3) * .015 });
}
function s5(t) { // 10.0 - 12.8 TOUR 18+ 2027
  const lt = t - 10.0;
  bg('#000');
  beams(t, .65);
  const hit1 = .0, hit2 = .35, hit3 = .8;
  const imp = Math.max(0, 1 - (lt - hit2) * 3) * (lt > hit2 ? 1 : 0);
  radial(W / 2, H / 2, Math.max(W, H) * .6, RED, .18 + imp * .5);
  const [sx, sy] = shake(lt, 30 * imp);
  // logo moves up and shrinks
  const lp = eOut(prog(lt, 0, .45));
  const lh = (520 - 300 * lp) * U * (PORTRAIT ? 1.05 : 1);
  const ly = H / 2 - (PORTRAIT ? 560 : 330) * U * lp;
  const out = 1 - prog(lt, 2.55, 2.8);
  logo(W / 2 + sx, ly + sy, lh, { alpha: out });
  const cy = PORTRAIT ? H * .53 : H * .58;
  txt('TOUR', W / 2 + sx, cy - 150 * U + sy, { size: 110 * U, color: '#fff', ls: .25, alpha: prog(lt, hit1 + .15, hit1 + .25) * out, scale: 1.3 - .3 * eBack(prog(lt, .15, .4)) });
  boxTxt('18+', W / 2 + sx, cy + 60 * U + sy, { size: 260 * U, padX: .25, padY: .12, alpha: prog(lt, hit2, hit2 + .08) * out, scale: 1.5 - .5 * eBack(prog(lt, hit2, hit2 + .3)) });
  txt('2027', W / 2 + sx, cy + 300 * U + sy, { size: 90 * U, weight: 800, color: CREAM, ls: .5, alpha: prog(lt, hit3, hit3 + .25) * out });
}
function s6(t) { // 12.8 - 15 end card
  const lt = t - 12.8;
  bg('#000');
  const fade = prog(lt, 0, .3) * (1 - prog(lt, 1.85, 2.2));
  radial(W / 2, H * .45, Math.max(W, H) * .55, RED, .28 * fade);
  b.save(); b.globalAlpha = fade;
  const top = PORTRAIT ? H * .30 : H * .22;
  logo(W / 2, top, (PORTRAIT ? 260 : 200) * U, { alpha: 1 });
  b.restore();
  const cy = PORTRAIT ? H * .52 : H * .52;
  txt('TOUR 18+ · 2027', W / 2, cy - 40 * U, { size: 70 * U, color: '#fff', ls: .12, alpha: fade });
  boxTxt('Reserva já a tua data.', W / 2, cy + 90 * U, { size: 84 * U, alpha: fade * prog(lt, .25, .5) });
  txt('minhotosmarotos.com', W / 2, cy + 215 * U, { size: 44 * U, weight: 600, color: CREAM, ls: .08, alpha: fade * prog(lt, .5, .75) });
}

function post(t) {
  ctx.clearRect(0, 0, W, H);
  // glitch windows: transitions
  const gl = [[2.35, 2.62], [5.1, 5.25], [7.9, 8.05], [12.7, 12.85]].some(([a, z]) => t >= a && t <= z);
  if (gl) {
    const f = Math.floor(t * 60);
    ctx.drawImage(buf, 0, 0);
    for (let i = 0; i < 14; i++) {
      const y = rnd(f * 3 + i) * H, h = (8 + rnd(f + i * 7) * 70) * U, dx = (rnd(f * 5 + i) - .5) * 160 * U;
      ctx.drawImage(buf, 0, y, W, h, dx, y, W, h);
    }
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .35;
    ctx.fillStyle = RED; ctx.fillRect(0, rnd(f) * H, W, 30 * U); ctx.restore();
  } else ctx.drawImage(buf, 0, 0);
  // grain
  const gi = GRAIN[Math.floor(t * 24) % GRAIN.length];
  ctx.save(); ctx.globalAlpha = .07; ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(gi, 0, 0, W, H); ctx.restore();
  // vignette
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

window.renderAt = t => {
  b.setTransform(1, 0, 0, 1, 0, 0); b.globalAlpha = 1;
  if (t < 2.6) s1(t); else if (t < 5.2) s2(t); else if (t < 8.0) s3(t); else if (t < 10.0) s4(t); else if (t < 12.8) s5(t); else s6(t);
  post(t);
};
window.ready = (async () => {
  await document.fonts.load(`900 100px "Inter Display"`); await document.fonts.load(`500 100px "Inter Display"`);
  await document.fonts.load(`700 100px "Inter Display"`); await document.fonts.load(`600 100px "Inter Display"`); await document.fonts.load(`800 100px "Inter Display"`);
  [LOGO, LOGOW, BAND] = await Promise.all([img('logo_red.png'), img('logo_white.png'), img('band.jpg')]);
  for (let k = 0; k < 6; k++) {
    const g = document.createElement('canvas'); g.width = 480; g.height = 270;
    const gx = g.getContext('2d'); const d = gx.createImageData(480, 270);
    for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    gx.putImageData(d, 0, 0); GRAIN.push(g);
  }
  return true;
})();
</script></body></html>
