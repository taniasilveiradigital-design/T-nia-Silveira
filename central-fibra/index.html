:root[data-theme="dark"]{

.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--side-fg);text-decoration:none;font-size:.92rem;opacity:.88}

.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}

.bar{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}

ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.list{display:flex;flex-direction:column}

.row .t{font-weight:600}
.row .s{grid-column:1/-1;font-size:.86rem;color:var(--muted)}
.when{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--muted);white-space:nowrap}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}

table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}

.tl div{position:relative}
.tl div::before{content:"";position:absolute;left:-32px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--acc)}
.tl div.now::before{background:var(--acc)}
.tl b{color:var(--acc);font-size:.85rem;display:block}

.check.done .t{text-decoration:line-through;color:var(--faint)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--castanho);color:#fff;padding:9px 16px;border-radius:10px;font-size:.88rem;z-index:50}

  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
  main{padding-block:18px 70px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ===== Navegação ===== */
function nav(cur){
 const n={clientes:S.clientes.filter(c=>c.estado==="Ativa").length,mail:S.mail.filter(m=>!m.feito).length,ideias:S.ideias.filter(i=>i.estado==="Viva").length};
 $("#nav").innerHTML=AREAS.map(a=>`<div><span class="lbl">${a.g}</span>${a.items.map(([id,l])=>`<a href="#${id}"${id===cur?' aria-current="page"':""}>${l}${n[id]?`<span class="n">${n[id]}</span>`:""}</a>`).join("")}</div>`).join("");
}
function render(){
 let r=location.hash.slice(1); if(!V[r])r="hoje";
 nav(r); $("#view").innerHTML=V[r](); document.body.classList.remove("navopen");
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
$("#menuBtn").onclick=()=>document.body.classList.add("navopen");
$("#scrim").onclick=()=>document.body.classList.remove("navopen");

/* ===== Ações ===== */
const fd=f=>Object.fromEntries(new FormData(f));
document.addEventListener("submit",e=>{
 const f=e.target; e.preventDefault(); const d=fd(f);
 if(f.id==="movForm"){S.movs.push({id:uid(),...d,valor:+d.valor});toast("Lançado.")}
 else if(f.id==="cliForm"){S.clientes.unshift({id:uid(),estado:"Ativa",valor:"",nota:"",...d});toast("Cliente adicionada.")}
 else if(f.id==="ideiaForm"){S.ideias.unshift({id:uid(),estado:"Viva",...d});toast("Ideia guardada.")}
 else if(f.id==="radarForm"){S.radar.unshift({id:uid(),...d});toast("Guardado no radar.")}
 else if(f.id==="mailForm"){S.mail.unshift({id:uid(),feito:false,s:"",...d});toast("Adicionado.")}
 else return;
 save(); render();
});
document.addEventListener("click",e=>{
 const b=e.target.closest("button"); if(!b)return;
 const ds=b.dataset; let k;
 if(ds.delMov){S.movs=S.movs.filter(x=>x.id!==ds.delMov)}
 else if(ds.delCli){S.clientes=S.clientes.filter(x=>x.id!==ds.delCli)}
 else if(ds.delIdeia){S.ideias=S.ideias.filter(x=>x.id!==ds.delIdeia)}
 else if(ds.delRadar){S.radar=S.radar.filter(x=>x.id!==ds.delRadar)}
 else if(ds.if){ideiaF=ds.if;render();return}
 else return;
 save(); render();
});
document.addEventListener("change",e=>{
 const t=e.target, ds=t.dataset;
 if(ds.cliEstado){S.clientes.find(x=>x.id===ds.cliEstado).estado=t.value}
 else if(ds.ideiaEstado){S.ideias.find(x=>x.id===ds.ideiaEstado).estado=t.value}
 else if(ds.mail){S.mail.find(x=>x.id===ds.mail).feito=t.checked}
 else if(ds.resp!==undefined){S.resp[ds.resp]=t.value.trim();save();toast("Responsável guardado.");return}
 else if(t.id==="meta"){S.meta=+t.value||0}
 else return;
 save(); render();
});
$("#expBtn").onclick=async()=>{
 const txt=JSON.stringify(S);
 try{await navigator.clipboard.writeText(txt);toast("Dados copiados. Guarda-os num ficheiro.")}
 catch(e){$("#view").insertAdjacentHTML("afterbegin",`<textarea class="inp" rows="4" readonly>${esc(txt)}</textarea>`);toast("Seleciona o texto e copia.")}
};
$("#impBtn").onclick=()=>{
 $("#view").insertAdjacentHTML("afterbegin",`<form class="add" id="impForm"><label class="wide">Cola aqui os dados copiados<textarea name="j" rows="4" required></textarea></label><button class="btn" type="submit">Repor dados</button></form>`);
 $("#impForm").addEventListener("submit",ev=>{ev.preventDefault();ev.stopPropagation();try{const o=JSON.parse(fd(ev.target).j);S={...JSON.parse(JSON.stringify(DEF)),...o};save();render();toast("Dados repostos.")}catch(err){toast("Esse texto não são dados da Central.")}},{capture:true});
};
render();
</script>
